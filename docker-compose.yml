services:
  db:
    # Pinned by digest (16.16); Dependabot (docker-compose ecosystem) proposes updates.
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      # Dev-only credentials for a throwaway local database. Never reuse them anywhere real.
      POSTGRES_USER: tracer
      POSTGRES_PASSWORD: tracer
      POSTGRES_DB: tracer
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tracer -d tracer"]
      interval: 2s
      timeout: 3s
      retries: 30
