name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: no-real-data
    attributes:
      label: Data check
      options:
        - label: I confirm this request contains no real UKG exports, employee data, payroll data or client documents
          required: true
