name: supply-chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spdx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_spdx.py .

  scripts-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv run --no-project --with pytest==9.2.0 python -m pytest scripts/tests -q -p no:cacheprovider

  licenses-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Guards key on the manifest, not the lockfile: if backend/ exists but its lockfile
      # was deleted, `uv sync --locked` fails the job instead of silently skipping the gate.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: hashFiles('backend/pyproject.toml') != ''
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Runtime dependencies
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          uv sync --locked --no-dev --all-extras --no-install-project
          uvx pip-licenses@5.5.5 --python .venv/bin/python --with-system --format=json --output-file "$RUNNER_TEMP/pip-runtime.json"
          python3 ../scripts/license_gate.py --pip-json "$RUNNER_TEMP/pip-runtime.json"
      - name: All dependency groups (LGPL allowed, dev only)
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          uv sync --locked --all-groups --all-extras --no-install-project
          uvx pip-licenses@5.5.5 --python .venv/bin/python --with-system --format=json --output-file "$RUNNER_TEMP/pip-all.json"
          python3 ../scripts/license_gate.py --pip-json "$RUNNER_TEMP/pip-all.json" --dev

  licenses-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: 22
      - if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Runtime dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npx --yes license-checker-rseidelsohn@5.0.1 --production --excludePrivatePackages --json > "$RUNNER_TEMP/npm-runtime.json"
          python3 ../scripts/license_gate.py --npm-json "$RUNNER_TEMP/npm-runtime.json"
      - name: All dependencies (LGPL allowed, dev only)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npx --yes license-checker-rseidelsohn@5.0.1 --excludePrivatePackages --json > "$RUNNER_TEMP/npm-all.json"
          python3 ../scripts/license_gate.py --npm-json "$RUNNER_TEMP/npm-all.json" --dev
      - name: Every platform in the lockfile (CI installs only Linux)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          python3 ../scripts/license_gate.py --npm-lock package-lock.json
          python3 ../scripts/license_gate.py --npm-lock package-lock.json --dev

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner v2.7.1 (sha256 verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan lockfiles that exist
        run: |
          # Key on the manifests: a deleted lockfile then fails the scan instead of skipping it.
          args=()
          [ -f backend/pyproject.toml ] && args+=("-L" backend/uv.lock)
          [ -f frontend/package.json ] && args+=("-L" frontend/package-lock.json)
          if [ "${#args[@]}" -eq 0 ]; then echo "no manifests yet"; exit 0; fi
          "$RUNNER_TEMP/osv-scanner" scan source "${args[@]}"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks v8.30.1 (sha256 verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
