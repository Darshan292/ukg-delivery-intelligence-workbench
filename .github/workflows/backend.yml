name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint-type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false
          python-version: "3.13"
      # The runner image does not guarantee PostgreSQL server binaries; pytest-postgresql
      # needs pg_ctl (tests/pg_locate.py finds it under /usr/lib/postgresql/<version>/bin).
      - name: Ensure PostgreSQL server binaries
        run: |
          if ! ls /usr/lib/postgresql/*/bin/pg_ctl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
          fi
          ls /usr/lib/postgresql/*/bin/pg_ctl
      - run: uv sync --locked
      # pytest-postgresql starts its own server from those binaries.
      - run: uv run --frozen pytest

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+pg8000://tracer:tracer@127.0.0.1:5432/tracer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false
          python-version: "3.13"
      - run: uv sync --locked --no-dev
      - run: docker compose up -d --wait db
        working-directory: .
      - run: uv run --frozen --no-dev alembic upgrade head
      - run: uv run --frozen --no-dev alembic upgrade head # idempotent
      - name: Assert tables exist
        working-directory: .
        run: |
          tables=$(docker compose exec -T db psql -U tracer -d tracer -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name in ('entity','relationship','evidence_locator')")
          test "$tables" = "3"
      - name: Down
        if: always()
        working-directory: .
        run: docker compose down -v
